<!DOCTYPE html>
<html lang="{{ .Site.Language.Lang }}">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{{ T "careers" }} - {{ .Site.Title }}</title>
    {{ partial "head.html" . }}
</head>

<body class="d-flex flex-column min-vh-100 bg-sudama-light">
    {{ partial "navbar.html" . }}

    <div class="container py-5 flex-grow-1">
        <h1 class="text-center text-sudama-dark fw-bold mb-5">{{ .Title }}</h1>

        <div class="row justify-content-center">
            <div class="col-lg-8">
                <div class="list-group shadow-sm border-0">
                    {{ range .Pages }}
                    <a href="{{ .Permalink }}"
                        class="list-group-item list-group-item-action p-4 border-0 mb-3 rounded shadow-sm">
                        <div class="d-flex w-100 justify-content-between align-items-center mb-2">
                            <h5 class="mb-1 text-sudama-dark fw-bold">{{ .Title }}</h5>
                            <small class="text-muted">{{ .Date.Format "Jan 2, 2006" }}</small>
                        </div>
                        <p class="mb-1 text-muted">{{ .Description }}</p>
                        <small class="text-primary">{{ T "read_more" | default "Read More" }} &rarr;</small>
                    </a>
                    {{ end }}
                </div>
            </div>
        </div>
    </div>

    {{ partial "footer.html" . }}
    {{ partial "scripts.html" . }}
</body>

</html>
