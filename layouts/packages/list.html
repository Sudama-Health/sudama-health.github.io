<!DOCTYPE html>
<html>
<head>
    <title>Posts</title>
</head>
<body>
    <h1>Posts</h1>
    <ul>
        {{ range .Paginator.Pages }}
        <li>
            <a href="{{ .Permalink }}">{{ .Title }}</a>
            <p>{{ .Date.Format "2006-01-02" }}</p>
            <p>{{ .Summary }}</p>
        </li>
        {{ end }}
    </ul>
</body>
</html>
