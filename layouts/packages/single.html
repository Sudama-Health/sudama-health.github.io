<!DOCTYPE html>
<html>

    <head>
        <title>Sudama Health Packages</title>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <link rel="stylesheet" href="/css/style.css" />

    <body>

                </header>
                <!-- <div class="mx-auto pt-5 content-background">
                <div class="card-body"> -->
                {{ .Content }}
                <!-- <div class="thinking-bubble">$1230</div>
                </div>
            </div> -->
            <div class="mx-auto pt-5 content-background"><div
                    class="card-body package-price-card ">
                    <span class="package-price badge bg-primary rounded-pill">
                        Special Sudama Package Price <span
                            class="package-price badge bg-success rounded-pill">

                    </span>
                    {{partial "booktestbutton.html" .}}
                </div></div>
            </div>
        </div>
        {{partial "footer.html" .}}
