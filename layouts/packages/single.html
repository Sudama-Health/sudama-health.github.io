<!DOCTYPE html>
<html>

    <head>
        <title>Sudama Health Packages</title>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <link rel="stylesheet" href="/css/style.css" />
        <link
            href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css"
            rel="stylesheet">
        {{ partial "head.html" . }}
    </head>

    <body>
        {{ partial "navbar.html" .}}

        <div class="text-white bg-dark background">
            <div class="cover-container text-center d-flex mx-2 flex-column">
                <header class="mb-auto text-shadow">
                    <h1 class="mt-5"><u>{{ .Title }}</u></h1>

                </header>

                <div class="row justify-content-center pt-5 m-2">
                    <div class="col-md-6 col-lg-5 mx-2 content-background">
                        {{ .Content }}
                    </div>
                </div>
                <div class="row justify-content-center pb-1 m-2">
                    <div class="col-md-6 col-lg-5 mx-2 pb-1 content-background">
                        <div class="card-body package-card">

                            <div
                                class=" card-text package-price badge bg-primary rounded-pill text-wrap lh-2 px-5">
                                {{ T "special_sudama_package_price"}}
                                <div class="text-wrap m-1">
                                    ₹{{.Params.Package_Price}} </div>
                            </div>
                            {{partial "booktestbutton.html" .}}
                        </div>
                    </div>
                </div>
            </div>
            <div style="font-size:10px;"> 
                * {{ T "prices-note"}}
            </div>
            {{ partial "footer.html" . }}
            {{ partial "scripts.html" . }}

        </body>

    </html>
